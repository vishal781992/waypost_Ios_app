# The Xcode project is generated, not committed — `xcodegen generate` builds it from
# this file. Keeps merge conflicts out of project.pbxproj and makes the target's
# settings readable in review.
name: Waypost
options:
  bundleIdPrefix: us.parkhop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Signing. Both targets need a team, and picking one in Xcode does not survive the
    # next `xcodegen generate` — the project is built from this file. Paste the ten
    # character Team ID from developer.apple.com (or from Xcode's Accounts pane, beside
    # the team name) and uncomment, and it holds through every regeneration.
    #
    # Left commented rather than filled in with a guess: a wrong team is a harder error
    # to read than a missing one.
    # DEVELOPMENT_TEAM: XXXXXXXXXX
    MARKETING_VERSION: 2.54.2
    CURRENT_PROJECT_VERSION: 105
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
  configs:
    # XcodeGen does not define DEBUG on its own, so `#if DEBUG` was false in *both*
    # configurations — which quietly compiled the capture hooks out of the debug build
    # the moment they were guarded.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_COMPILATION_MODE: wholemodule

# The project's first external dependency. Declared here rather than added through
# Xcode's package UI, because `Waypost.xcodeproj` is generated from this file and
# gitignored: a package added in Xcode is deleted by the next `xcodegen generate`.
#
# Pinned to a major. Appwrite's Apple SDK follows semver and 19 will break the call sites,
# so `from` takes the patches and the minors and stops before that.
packages:
  Appwrite:
    url: https://github.com/appwrite/sdk-for-apple
    from: 18.3.0

targets:
  Waypost:
    type: application
    platform: iOS
    dependencies:
      - package: Appwrite
      # The widget rides in the app's own bundle, so the app has to build it.
      - target: WaypostWidgets
    sources:
      - path: Waypost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.parkhop.waypost
        PRODUCT_NAME: Waypost
        INFOPLIST_FILE: Waypost/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # WeatherKit is switched off: the entitlement requires a paid Apple Developer
        # Program membership, and a free personal team cannot generate a profile that
        # carries it. Point this back at Waypost/Waypost.entitlements and define
        # PARKHOP_WEATHERKIT to turn it on again.
        # CODE_SIGN_ENTITLEMENTS: Waypost/Waypost.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        # Without this the catalog is compiled and the icon inside it is never chosen,
        # so the app ships with the blank white tile iOS falls back to. XcodeGen sets no
        # default for it, and `GENERATE_INFOPLIST_FILE: NO` means Xcode will not write
        # the matching CFBundleIconName either — that is in Info.plist by hand.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The widget extension. Its own process, its own bundle and its own memory budget —
  # which is why it carries a copy of the park register and five colours rather than
  # importing the app's design system.
  WaypostWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WaypostWidgets
      # The register, into the extension's own bundle. A widget cannot read the app's.
      - path: Waypost/Resources/national-parks.json
        buildPhase: resources
      # And the display face. A widget cannot reach the app's fonts either: `Font.custom`
      # falls back silently to the system face, which is why the first plate drew a park's
      # name in SF. One weight only — the plate uses no other.
      - path: Waypost/Resources/Fonts/CormorantGaramond-SemiBold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.parkhop.waypost.widgets
        PRODUCT_NAME: WaypostWidgets
        INFOPLIST_FILE: WaypostWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES
        # The app group is switched off for the reason WeatherKit is: it is a capability,
        # and a free personal team cannot sign one. With it off the plate still shows a
        # park and still opens it — only the save control is withheld, because a button
        # that cannot write where the app will read is a button that does nothing.
        #
        # To turn it on: uncomment both entitlement blocks, both CODE_SIGN_ENTITLEMENTS
        # lines, and add PARKHOP_APP_GROUP to both targets' SWIFT_ACTIVE_COMPILATION_CONDITIONS.
        # CODE_SIGN_ENTITLEMENTS: WaypostWidgets/WaypostWidgets.entitlements
