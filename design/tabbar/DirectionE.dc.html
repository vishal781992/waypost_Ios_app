<!doctype html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
           color: #201F1D; background: #D1CFA5; -webkit-font-smoothing: antialiased; }
    a { color: #7D5411; } a:hover { color: #5A3B0A; }
    .kicker { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: #B68235; }
    .display { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; }
    .cap { font-size: 12px; opacity: .64; line-height: 1.5; }
    .tick { font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; opacity: .5; }
    /* The bar: 6px gutter, four 68x52 items, a 62pt glass plate behind them. */
    .bar { display: inline-flex; padding: 0 6px; height: 62px; align-items: center;
           border-radius: 999px; background: rgba(250,249,248,.62);
           backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
           border: 1px solid rgba(0,0,0,.07);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.72), inset 0 -1px 0 rgba(255,255,255,.42),
                       0 4px 12px rgba(24,16,8,.10); }
    .item { width: 68px; height: 52px; border-radius: 999px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 3px; }
    .item.on { background: rgba(219,230,76,.90); }
    .label { font-size: 11px; line-height: 1; color: #7D7979; }
    .item.on .label { font-weight: 600; color: #2D2B2B; }
    .glyphbox { width: 29px; height: 29px; display: flex; align-items: center; justify-content: center; }
    .emoji { line-height: 1; }
  </style>
</helmet>

<div style="width: 420px; height: 370px; box-sizing: border-box; padding: 26px 24px; background: #D1CFA5">

  <div class="display" style="font-size: 27px; line-height: 1.1; margin-top: 4px">Glyph with a badge</div>

svg><span class="emoji" style="position: absolute; right: -1px; bottom: 0; font-size: 13px; text-shadow: 0 0 3px rgba(250,249,248,.95), 0 0 3px rgba(250,249,248,.95)">🏔️</span></div><div class="label">Profile</div></div></div></div>
