<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
           color: #201F1D; background: #D1CFA5; -webkit-font-smoothing: antialiased; }
    a { color: #7D5411; } a:hover { color: #5A3B0A; }
    .kick { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: #B68235; }
    .cap { font-size: 11.5px; opacity: .64; line-height: 1.55; }
    .display { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; }
    .stage { background: radial-gradient(120% 100% at 50% 0%, #23302a 0%, #14181a 70%);
             border-radius: 22px; padding: 40px 30px; perspective: 900px; }
    /* The card itself: pine, with a brass rim that catches the light. */
    .pass { width: 300px; height: 190px; border-radius: 18px; position: relative; overflow: hidden;
            background: linear-gradient(160deg, #12332c 0%, #0B2B26 52%, #071d19 100%);
            box-shadow: 0 22px 44px rgba(0,0,0,.52), 0 2px 0 rgba(255,255,255,.06) inset;
            transform-style: preserve-3d; transition: transform .18s ease-out; }
    .rim { position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
           border: 1px solid rgba(198,158,86,.55);
           box-shadow: inset 0 1px 0 rgba(255,225,170,.34), inset 0 -1px 0 rgba(0,0,0,.4); }
    .sheen { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
    .foil  { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: .30; }
    .brass { color: #E8C88B; }
  </style>
</helmet>

<div style="width: 400px; background: #D1CFA5; padding: 24px 22px 26px; box-sizing: border-box">
  <div class="kick">Alternate</div>
  <div class="display" style="font-size: 27px; line-height: 1.08; margin-top: 3px">The enamel token</div>
  <div class="cap" style="margin-top: 6px">A struck disc rather than a card: raised rim, filled enamel, the year around the edge like lettering on a coin.</div>
  <div class="stage" style="margin-top: 16px; display: flex; justify-content: center"><div style="perspective: 900px">
  <div style="width: 190px; height: 190px; border-radius: 999px; position: relative;
              background: radial-gradient(120% 120% at 32% 22%, #17453b 0%, #0B2B26 58%, #061713 100%);
              box-shadow: 0 20px 40px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,225,170,.30);
              border: 2px solid rgba(198,158,86,.6); transform: rotateX(8deg) rotateY(-12deg)">
    <svg width="190" height="190" viewBox="0 0 190 190" style="position: absolute; inset: 0" aria-hidden="true">
      <defs><path id="ring" d="M 95 95 m -66 0 a 66 66 0 1 1 132 0 a 66 66 0 1 1 -132 0"/></defs>
      <text font-size="10" letter-spacing="4.4" fill="#C69E56" opacity=".85">
        <textPath href="#ring" startOffset="4%">PARKHOP &#183; YEAR PASS &#183; MMXXVI</textPath>
      </text>
      <g fill="none" stroke="#C69E56" stroke-width="0.9" opacity=".38">
        <path d="M 44 108 C 66 92, 84 120, 104 100 S 140 88, 150 100"/>
        <path d="M 46 120 C 68 104, 86 132, 106 112 S 142 100, 152 112"/>
      </g>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column;
                align-items: center; justify-content: center">
      <div class="display" style="font-size: 42px; color: #E8C88B; line-height: 1">63</div>
      <div style="font-size: 8px; letter-spacing: 1.8px; text-transform: uppercase; color: rgba(232,200,139,.6); margin-top: 2px">parks &#183; 6 stood in</div>
    </div>
    <div style="position: absolute; inset: 0; border-radius: 999px; mix-blend-mode: screen;
                background: radial-gradient(40% 40% at 28% 22%, rgba(255,246,224,.42) 0%, rgba(255,255,255,0) 62%)"></div>
  </div>
</div></div>
</div>
</x-dc>
</body>
</html>
